<text x="380" y="460" font-family="Arial,sans-serif" font-size="12" text-anchor="start" fill="#555">Mensajes: "Correo o contraseña incorrectos." (E1)</text>
<text x="380" y="482" font-family="Arial,sans-serif" font-size="12" text-anchor="start" fill="#555">Mensajes: "Cuenta desactivada. Contacta al administrador." (E2)</text>
