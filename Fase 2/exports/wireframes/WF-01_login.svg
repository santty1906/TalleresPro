<text x="340" y="566" font-family="Arial,sans-serif" font-size="12" text-anchor="start" fill="#555">Sin autorregistro: RF-01 es gestión del Admin en V-03.</text>
<text x="340" y="586" font-family="Arial,sans-serif" font-size="12" text-anchor="start" fill="#555">Éxito → V-02 / inicio por rol (P-01). Fallo → permanece en V-01.</text>
<text x="340" y="606" font-family="Arial,sans-serif" font-size="12" text-anchor="start" fill="#555">Sesión activa (A1) → redirige, no muestra login.</text>
