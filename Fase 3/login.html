<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión · TalleresPro</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-vista="login">
<a class="saltar" href="#contenido">Saltar al contenido</a>
<div class="acceso">
<header class="acceso-lado">
<a class="marca" href="login.html"><span class="marca-icono"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3.5 17.3a1.9 1.9 0 0 0 2.7 2.7l5.8-5.8a4 4 0 0 0 5.2-5.4l-2.4 2.4-2.1-.5-.5-2.1z"/></svg></span>TalleresPro</a>
<hgroup>
<h2>Todo el taller, en un solo lugar.</h2>
<p>Clientes, vehículos, órdenes de reparación, inventario y finanzas conectados en una sola plataforma.</p>
</hgroup>
<p class="usuario-rol">Gestión de talleres de reparación y mantenimiento</p>
</header>
<main class="acceso-panel" id="contenido" tabindex="-1">
<section class="acceso-caja" aria-labelledby="titulo-login">
<h1 id="titulo-login">Iniciar sesión</h1>
<p class="texto-suave">Ingresa con tu correo y contraseña.</p>
<div id="avisos" role="status" aria-live="polite" style="margin-top:1rem"></div>
<form id="form-login" class="formulario" novalidate>
<p class="aviso aviso-error" id="error-login" role="alert" tabindex="-1" hidden></p>
<p class="campo"><label for="correo">Correo</label>
<input id="correo" name="correo" type="email" autocomplete="username" required></p>
<p class="campo"><label for="clave">Contraseña</label>
<span class="campo-con-boton">
<input id="clave" name="clave" type="password" autocomplete="current-password" required>
<button type="button" class="btn btn-secundario" id="btn-ver" aria-pressed="false">Ver</button>
</span></p>
<button type="submit" class="btn btn-primario">Ingresar</button>
</form>
</section>
</main>
</div>
<script src="js/datos.js"></script><script src="js/sesion.js"></script><script src="js/ui.js"></script>
<script src="js/vistas/login.js"></script>
</body>
</html>
